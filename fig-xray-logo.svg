<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fig silhouette -->
    <path id="fig" d="M256 110 C230 110 222 140 214 170 C200 220 120 260 120 340 C120 410 180 442 256 442 C332 442 392 410 392 340 C392 260 312 220 298 170 C290 140 282 110 256 110 Z"/>
    <!-- Inner seed cavity -->
    <path id="cavity" d="M256 196 C245 196 240 228 236 250 C226 292 178 310 178 356 C178 396 214 412 256 412 C298 412 334 396 334 356 C334 310 286 292 276 250 C272 228 267 196 256 196 Z"/>

    <clipPath id="leftHalf"><rect x="0" y="0" width="256" height="512"/></clipPath>
    <clipPath id="rightHalf"><rect x="256" y="0" width="256" height="512"/></clipPath>
    <clipPath id="badge"><rect x="0" y="0" width="512" height="512" rx="104"/></clipPath>

    <!-- Natural fig skin -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A4E86"/>
      <stop offset="0.55" stop-color="#6A2C5E"/>
      <stop offset="1" stop-color="#3A1636"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C8A3A"/>
      <stop offset="0.35" stop-color="#7C8A3A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.32" cy="0.42" r="0.35">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5E8C3A"/>
      <stop offset="1" stop-color="#8DBA4E"/>
    </linearGradient>

    <!-- X-ray -->
    <radialGradient id="filmGlow" cx="0.75" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#14304A"/>
      <stop offset="1" stop-color="#07101B"/>
    </radialGradient>
    <radialGradient id="xrayBody" cx="0.5" cy="0.65" r="0.55">
      <stop offset="0" stop-color="#BFEFFF" stop-opacity="0.10"/>
      <stop offset="0.75" stop-color="#8FD8FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D8F6FF" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="xrayCavity" cx="0.5" cy="0.65" r="0.6">
      <stop offset="0" stop-color="#E6FAFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#BDEBFF" stop-opacity="0.28"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#badge)">
    <!-- Backgrounds -->
    <rect x="0" y="0" width="256" height="512" fill="#F5EEE4"/>
    <rect x="256" y="0" width="256" height="512" fill="url(#filmGlow)"/>

    <!-- ===== LEFT: real fig ===== -->
    <g clip-path="url(#leftHalf)">
      <!-- leaf -->
      <path d="M250 116 C236 82 204 58 166 62 C150 64 140 74 136 84 C158 82 168 92 170 100 C186 98 198 106 200 116 C216 112 236 116 250 116 Z" fill="url(#leaf)"/>
      <path d="M250 116 C220 98 188 82 150 74 M206 96 L194 76 M222 104 L218 84" stroke="#3F6A25" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- stem -->
      <path d="M248 84 C250 96 250 104 248 116 L264 116 C262 104 262 94 266 84 Z" fill="#6D5A2E"/>
      <!-- body -->
      <use href="#fig" fill="url(#skin)"/>
      <use href="#fig" fill="url(#neck)"/>
      <!-- skin ribs -->
      <g stroke="#2E0F2A" stroke-opacity="0.28" stroke-width="2" fill="none">
        <path d="M232 150 C210 230 160 290 168 420"/>
        <path d="M244 150 C236 240 214 320 218 438"/>
      </g>
      <use href="#fig" fill="url(#shine)"/>
      <!-- speckles -->
      <g fill="#F3D9EC" fill-opacity="0.35">
        <circle cx="170" cy="330" r="2"/><circle cx="196" cy="300" r="1.6"/><circle cx="186" cy="372" r="1.8"/>
        <circle cx="222" cy="260" r="1.5"/><circle cx="150" cy="360" r="1.4"/><circle cx="230" cy="400" r="1.7"/>
        <circle cx="208" cy="342" r="1.3"/><circle cx="160" cy="300" r="1.2"/>
      </g>
    </g>

    <!-- ===== RIGHT: x-ray fig ===== -->
    <g clip-path="url(#rightHalf)">
      <!-- film scan lines -->
      <g stroke="#6FC8F0" stroke-opacity="0.05" stroke-width="1">
        <path d="M256 40 H512 M256 72 H512 M256 104 H512 M256 136 H512 M256 168 H512 M256 200 H512 M256 232 H512 M256 264 H512 M256 296 H512 M256 328 H512 M256 360 H512 M256 392 H512 M256 424 H512 M256 456 H512 M256 488 H512"/>
      </g>
      <!-- stem -->
      <path d="M248 84 C250 96 250 104 248 116 L264 116 C262 104 262 94 266 84 Z" fill="#CDEFFF" fill-opacity="0.35" stroke="#A9E6FF" stroke-width="1.5" filter="url(#glow)"/>
      <!-- outer skin -->
      <use href="#fig" fill="url(#xrayBody)" stroke="#BFF0FF" stroke-width="3" filter="url(#glow)"/>
      <!-- flesh layer -->
      <path d="M256 128 C238 128 234 152 228 176 C214 228 140 266 140 340 C140 400 192 426 256 426 C320 426 372 400 372 340 C372 266 298 228 284 176 C278 152 274 128 256 128 Z" fill="none" stroke="#8FD8FF" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 5"/>
      <!-- cavity -->
      <use href="#cavity" fill="url(#xrayCavity)" stroke="#D6F7FF" stroke-opacity="0.85" stroke-width="2" filter="url(#glow)"/>
      <!-- fibers from the eye up into the cavity -->
      <g stroke="#9FE3FF" stroke-opacity="0.55" stroke-width="1.4" fill="none" stroke-linecap="round">
        <path d="M256 436 C262 400 270 340 266 220"/>
        <path d="M256 436 C276 410 300 360 300 300"/>
        <path d="M256 436 C290 420 324 390 326 350"/>
        <path d="M256 436 C300 430 330 410 340 380"/>
        <path d="M256 436 C268 410 284 360 284 268"/>
      </g>
      <!-- seeds -->
      <g fill="#F2FDFF" filter="url(#glow)">
        <ellipse cx="264" cy="236" rx="3.2" ry="6" transform="rotate(-10 264 236)"/>
        <ellipse cx="272" cy="262" rx="3.4" ry="6.2" transform="rotate(-25 272 262)"/>
        <ellipse cx="286" cy="286" rx="3.5" ry="6.4" transform="rotate(-38 286 286)"/>
        <ellipse cx="302" cy="306" rx="3.5" ry="6.4" transform="rotate(-50 302 306)"/>
        <ellipse cx="316" cy="328" rx="3.5" ry="6.4" transform="rotate(-65 316 328)"/>
        <ellipse cx="322" cy="354" rx="3.5" ry="6.4" transform="rotate(-88 322 354)"/>
        <ellipse cx="318" cy="378" rx="3.5" ry="6.4" transform="rotate(-110 318 378)"/>
        <ellipse cx="304" cy="396" rx="3.5" ry="6.4" transform="rotate(-130 304 396)"/>
        <ellipse cx="284" cy="404" rx="3.4" ry="6.2" transform="rotate(-155 284 404)"/>
        <ellipse cx="264" cy="406" rx="3.2" ry="6" transform="rotate(-172 264 406)"/>
        <ellipse cx="268" cy="296" rx="3" ry="5.6" transform="rotate(-25 268 296)"/>
        <ellipse cx="288" cy="324" rx="3" ry="5.6" transform="rotate(-50 288 324)"/>
        <ellipse cx="300" cy="356" rx="3" ry="5.6" transform="rotate(-85 300 356)"/>
        <ellipse cx="290" cy="382" rx="3" ry="5.6" transform="rotate(-125 290 382)"/>
        <ellipse cx="268" cy="388" rx="3" ry="5.6" transform="rotate(-160 268 388)"/>
        <ellipse cx="276" cy="350" rx="2.6" ry="5" transform="rotate(-75 276 350)"/>
        <ellipse cx="264" cy="326" rx="2.6" ry="5" transform="rotate(-20 264 326)"/>
        <ellipse cx="262" cy="270" rx="2.6" ry="5" transform="rotate(-8 262 270)"/>
      </g>
      <!-- ostiole (the eye) -->
      <ellipse cx="256" cy="436" rx="9" ry="4" fill="#E9FBFF" filter="url(#glow)"/>
    </g>

    <!-- split line -->
    <line x1="256" y1="0" x2="256" y2="512" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  </g>
</svg>
